<text x="170" y="452" font-size="15" font-weight="400" fill="#566273" text-anchor="middle">eFPGA fabric</text>
<text x="170" y="484" font-size="15" font-weight="400" fill="#566273" text-anchor="middle">Partial reconfiguration</text>
<text x="170" y="508" font-size="13.5" font-weight="400" fill="#566273" text-anchor="middle">(FPGA only)</text>
<text x="170" y="548" font-size="15" font-weight="400" fill="#566273" text-anchor="middle">Two-core degraded mode</text>
<text x="170" y="580" font-size="15" font-weight="400" fill="#566273" text-anchor="middle">Debug module / JTAG</text>
<text x="170" y="612" font-size="15" font-weight="400" fill="#566273" text-anchor="middle">Boot ROM and loader</text>
<text x="170" y="644" font-size="15" font-weight="400" fill="#566273" text-anchor="middle">DMA, SPI, I²C</text>
<text x="170" y="676" font-size="15" font-weight="400" fill="#566273" text-anchor="middle">Interrupt controller</text>
<text x="170" y="708" font-size="15" font-weight="400" fill="#566273" text-anchor="middle">Fabrication</text>
<rect x="340" y="150" width="800" height="350" rx="14" fill="#F5F8FE" stroke="#2A62C9" stroke-width="2.4"/>
<text x="360" y="181" font-size="21" font-weight="700" fill="#2A62C9" text-anchor="start">PHX_CORE — redundant CPU cluster</text>
<text x="1120" y="181" font-size="15" font-weight="400" fill="#566273" text-anchor="end">three cores in lockstep</text>
<rect x="370" y="200" width="230" height="140" rx="10" fill="#E8F0FC" stroke="#2A62C9" stroke-width="2.2"/>
<text x="485.0" y="258.5" font-size="20" font-weight="700" fill="#2A62C9" text-anchor="middle">Ibex core A</text>
<text x="485.0" y="282.0" font-size="14.5" font-weight="400" fill="#18212D" text-anchor="middle">RV32IMC, 2-stage</text>
<text x="485.0" y="303.5" font-size="14.5" font-weight="400" fill="#18212D" text-anchor="middle">instruction port + data port</text>
<line x1="485" y1="342" x2="485" y2="378" stroke="#2A62C9" stroke-width="2.4" marker-end="url(#ae)"/>
