<text x="995.0" y="303.5" font-size="14.5" font-weight="400" fill="#18212D" text-anchor="middle">instruction port + data port</text>
<line x1="995" y1="342" x2="995" y2="378" stroke="#2A62C9" stroke-width="2.4" marker-end="url(#ae)"/>
<rect x="370" y="380" width="740" height="100" rx="10" fill="#FCEAE8" stroke="#C23B2E" stroke-width="2.2" stroke-dasharray="9 6"/>
<text x="740.0" y="418.0" font-size="20" font-weight="700" fill="#C23B2E" text-anchor="middle">Voting stage</text>
<text x="740.0" y="442.0" font-size="15" font-weight="400" fill="#18212D" text-anchor="middle">Majority voters: 103 output bits, bitwise 2-of-3</text>
<text x="740.0" y="464.0" font-size="15" font-weight="400" fill="#18212D" text-anchor="middle">Discrepancy detector: names the core that disagrees</text>
<rect x="1300" y="150" width="450" height="350" rx="10" fill="#FCEAE8" stroke="#C23B2E" stroke-width="2.2" stroke-dasharray="9 6"/>
<text x="1525.0" y="192" font-size="20" font-weight="700" fill="#C23B2E" text-anchor="middle">PHX_RM — recovery manager</text>
<text x="1525.0" y="215.5" font-size="14.5" font-weight="400" fill="#18212D" text-anchor="middle">Detect → save state → reset cores</text>
<text x="1525.0" y="237.0" font-size="14.5" font-weight="400" fill="#18212D" text-anchor="middle">→ restore state → verify</text>
<text x="1525.0" y="258.5" font-size="14.5" font-weight="400" fill="#18212D" text-anchor="middle"></text>
<text x="1525.0" y="280.0" font-size="14.5" font-weight="400" fill="#18212D" text-anchor="middle">If recovery keeps failing:</text>
<text x="1525.0" y="301.5" font-size="14.5" font-weight="400" fill="#18212D" text-anchor="middle">retry, then system reset, then safe state</text>
<text x="1525.0" y="323.0" font-size="14.5" font-weight="400" fill="#18212D" text-anchor="middle"></text>
<text x="1525.0" y="344.5" font-size="14.5" font-weight="400" fill="#18212D" text-anchor="middle">Periodic scrub · watchdog timer</text>
<text x="1525.0" y="366.0" font-size="14.5" font-weight="400" fill="#18212D" text-anchor="middle">Bus-timeout faults: reset or isolate one target</text>
<text x="1525.0" y="387.5" font-size="14.5" font-weight="400" fill="#18212D" text-anchor="middle">Fault injection and latency counters</text>
<text x="1220" y="222" font-size="14" font-weight="600" fill="#C23B2E" text-anchor="middle">resync interrupt</text>
<line x1="1298" y1="232" x2="1144" y2="232" stroke="#C23B2E" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ae)"/>
