<text x="170.0" y="257.25" font-size="14.5" font-weight="400" fill="#18212D" text-anchor="middle">Reset: active low,</text>
<text x="170.0" y="278.75" font-size="14.5" font-weight="400" fill="#18212D" text-anchor="middle">async assert, sync release</text>
