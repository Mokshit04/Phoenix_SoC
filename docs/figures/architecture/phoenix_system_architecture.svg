<text x="1297.5" y="767.0" font-size="14.5" font-weight="400" fill="#18212D" text-anchor="middle">2 channels</text>
<text x="1297.5" y="788.5" font-size="14.5" font-weight="400" fill="#18212D" text-anchor="middle">ADR-008</text>
