<rect x="1400" y="690" width="165" height="130" rx="10" fill="#FDF3DF" stroke="#B0750F" stroke-width="2.2"/>
<text x="1482.5" y="743.5" font-size="20" font-weight="700" fill="#B0750F" text-anchor="middle">UART</text>
