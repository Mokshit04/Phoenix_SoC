<rect width="1800" height="1250" fill="#FFFFFF"/>
<text x="50" y="62" font-size="36" font-weight="700" fill="#18212D" text-anchor="start">Phoenix SoC — system architecture</text>
<text x="50" y="96" font-size="17" font-weight="400" fill="#566273" text-anchor="start">Architecture frozen, 19 November 2026.  Logic verified in a cycle-level model; no block has RTL yet.</text>
