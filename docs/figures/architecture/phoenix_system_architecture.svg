<text x="1482.5" y="930" font-size="14.5" font-weight="600" fill="#B0750F" text-anchor="middle">TX / RX</text>
<text x="50" y="985" font-size="17" font-weight="700" fill="#18212D" text-anchor="start">How to read it</text>
<rect x="50" y="1003" width="26" height="18" rx="4" fill="#E8F0FC" stroke="#2A62C9" stroke-width="2"/>
<text x="86" y="1018" font-size="15" font-weight="400" fill="#18212D" text-anchor="start">Processor</text>
<rect x="190.8" y="1003" width="26" height="18" rx="4" fill="#27313F" stroke="#27313F" stroke-width="2"/>
<text x="226.8" y="1018" font-size="15" font-weight="400" fill="#18212D" text-anchor="start">Interconnect</text>
<rect x="359.2" y="1003" width="26" height="18" rx="4" fill="#E3F4F1" stroke="#16806F" stroke-width="2"/>
<text x="395.2" y="1018" font-size="15" font-weight="400" fill="#18212D" text-anchor="start">Memory</text>
<rect x="472.4" y="1003" width="26" height="18" rx="4" fill="#FDF3DF" stroke="#B0750F" stroke-width="2"/>
<text x="508.4" y="1018" font-size="15" font-weight="400" fill="#18212D" text-anchor="start">Peripherals</text>
<rect x="631.5999999999999" y="1003" width="26" height="18" rx="4" fill="#F1EAFB" stroke="#6B3FB8" stroke-width="2"/>
<text x="667.5999999999999" y="1018" font-size="15" font-weight="400" fill="#18212D" text-anchor="start">Accelerator</text>
<rect x="790.8" y="1003" width="26" height="18" rx="4" fill="#FCEAE8" stroke="#C23B2E" stroke-width="2"/>
<text x="826.8" y="1018" font-size="15" font-weight="400" fill="#18212D" text-anchor="start">Recovery logic</text>
<rect x="50" y="1041" width="46" height="20" rx="4" fill="none" stroke="#18212D" stroke-width="2.2"/>
<text x="108" y="1057" font-size="15" font-weight="400" fill="#18212D" text-anchor="start">Solid outline: built first, as a single-core SoC</text>
<rect x="520" y="1041" width="46" height="20" rx="4" fill="none" stroke="#18212D" stroke-width="2.2" stroke-dasharray="9 6"/>
<text x="578" y="1057" font-size="15" font-weight="400" fill="#18212D" text-anchor="start">Dashed outline: added once that works (cores B and C, voting, PHX_RM, accelerator)</text>
<line x1="50" y1="1092" x2="1750" y2="1092" stroke="#D5DBE3" stroke-width="1.4"/>
<text x="50" y="1118" font-size="14.5" font-weight="400" fill="#566273" text-anchor="start">Only what the cores send out is voted. Read data, grants, responses and interrupts are wired identically to all three cores, so they stay in step.</text>
<text x="50" y="1145" font-size="14.5" font-weight="400" fill="#566273" text-anchor="start">Interrupts go straight to Ibex inputs: Timer on the timer line; UART, PHX_ACC and PHX_RM on fast-interrupt lines. No interrupt controller is needed.</text>
<text x="50" y="1172" font-size="14.5" font-weight="400" fill="#566273" text-anchor="start">Voters, discrepancy detector and PHX_RM are single copies. A fault inside them is not masked; this is an accepted, documented limitation.</text>
<text x="50" y="1199" font-size="14.5" font-weight="400" fill="#566273" text-anchor="start">Address regions: IMEM 0x0000_0000 · DMEM 0x2000_0000 · peripherals 0x4000_0000 · accelerators 0x5000_0000 · PHX_RM 0xE000_0000.</text>
</svg>